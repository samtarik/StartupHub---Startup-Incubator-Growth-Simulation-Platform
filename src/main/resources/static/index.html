<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StartupHub</title>
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('startuphub-theme')||'light')}catch(e){}</script>
  <script src="/js/api.js"></script>
</head>
<body>
<script>
  // Session check on entry: straight to the dashboard if signed in, otherwise login.
  Api.get('/api/auth/me', { allowUnauthenticated: true })
    .then(() => window.location.replace('/dashboard.html'))
    .catch(() => window.location.replace('/login.html'));
</script>
</body>
</html>
